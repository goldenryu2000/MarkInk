[package]
name = "markink"
version = "0.1.0"
edition = "2024"
description = "A fast, reliable Markdown note-taking editor"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["markdown", "editor", "notes"]
categories = ["text-editors"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
iced = { version = "0.14", features = ["markdown", "highlighter", "tokio"] }
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.9"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "core"
harness = false
