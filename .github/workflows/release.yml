# Builds release packages. A `v*` tag creates a draft GitHub release;
# pull requests touching packaging build the same files as artifacts only.
name: Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - build.rs
      - assets/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - run: cargo build --release --locked
      - run: cargo packager --release --formats deb
      - name: Tarball
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name=markink-$version-linux-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/release/markink README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.tar.gz

  macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: apple-silicon
          - target: x86_64-apple-darwin
            arch: intel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo packager --release --target ${{ matrix.target }} --formats app
      - name: Ad-hoc sign and build dmg
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=$(find dist -maxdepth 2 -name 'MarkInk.app' | head -1)
          # Free ad-hoc signature: macOS then offers "Open Anyway" instead of "damaged".
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir stage
          cp -R "$app" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname MarkInk -srcfolder stage -ov -format UDZO \
            "dist/MarkInk-$version-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - run: cargo build --release --locked
      - run: cargo packager --release --formats nsis
      - name: Portable exe
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cp target/release/markink.exe "dist/MarkInk-$version-windows-x86_64-portable.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*setup.exe
            dist/*portable.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
